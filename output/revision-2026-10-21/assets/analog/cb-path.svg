<svg xmlns="http://www.w3.org/2000/svg" width="700" height="470" viewBox="0 0 700 470" role="img" aria-labelledby="t d">
<title id="t">共基极中频交流通路</title><desc id="d">基极接交流地，发射极为输入端，集电极为输出端。发射极偏置电阻 RE 接地，集电极 RC 和负载 RL 并联接交流地。输入正电压使发射结电压减少，输出电压增加。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4 1 7Z" fill="#426c51"/></marker></defs>
<rect width="700" height="470" fill="#fbfcf8" rx="12"/>
<style>text{font-family:Georgia,'Microsoft YaHei',serif;font-size:22px;fill:#35533e}.small{font-family:'Microsoft YaHei',sans-serif;font-size:16px;fill:#7b8c72}.w{fill:none;stroke:#426c51;stroke-width:2}</style>
<text x="30" y="35" class="small">共基 CB：E 输入 → C 输出；B 为交流公共端</text>
<g class="w"><path d="M290 180V233M290 189L370 145H585V250M290 224L370 271V300H100M290 207H215V230M197 230H233M203 237H227M210 244H220M370 300V323M370 373V408H585V310M100 408H370M470 145V213M470 273V408M350 408V421M332 421H368M339 428H361M345 435H355"/>
<rect x="458" y="213" width="24" height="60"/><rect x="573" y="250" width="24" height="60"/><rect x="358" y="323" width="24" height="50"/><path d="M318 240L350 259" marker-end="url(#a)"/>
<circle cx="100" cy="300" r="4"/><circle cx="100" cy="408" r="4"/><circle cx="370" cy="300" r="4"/></g>
<text x="235" y="196">B</text><text x="380" y="136">C</text><text x="383" y="300">E</text><text x="492" y="250">RC</text><text x="610" y="286">RL</text><text x="385" y="358">RE</text><text x="65" y="360">ui</text><text x="540" y="127">uo</text><text x="101" y="230" class="small">交流地</text>
<text x="30" y="461" class="small">基极旁路充分时成立；低输入电阻需连同信号源内阻考虑。</text>
</svg>
