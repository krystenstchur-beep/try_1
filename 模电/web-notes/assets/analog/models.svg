<svg xmlns="http://www.w3.org/2000/svg" width="700" height="540" viewBox="0 0 700 540" role="img" aria-labelledby="title desc">
<title id="title">直流放大模型与低频小信号模型</title><desc id="desc">上图用固定基射压降和由基极电流控制的集电极电流表示直流放大模型。下图用输入电阻 rbe 与从集电极流向发射极的 beta ib 受控源表示增量模型，输出电阻 rce 为可选项。</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4 1 7Z" fill="#426c51"/></marker></defs>
<rect width="700" height="540" rx="12" fill="#fbfcf8"/>
<style>text{font-family:'Microsoft YaHei',sans-serif;fill:#35533e;font-size:17px}.small{font-size:14px;fill:#70836c}.head{font-size:21px;font-weight:600}.wire{stroke:#426c51;stroke-width:2;fill:none}.optional{stroke-dasharray:6 5;stroke:#a58d62}.label{font-family:Georgia,serif;font-style:italic;font-size:20px}</style>
<text x="30" y="36" class="head">直流 · 先判断工作状态</text>
<text x="30" y="62" class="small">仅正向放大：给定 UBEQ，忽略漏电与输出斜率</text>
