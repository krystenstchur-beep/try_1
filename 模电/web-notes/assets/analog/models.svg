<text x="94" y="116" class="label">b</text><text x="491" y="96" class="label">c</text><text x="354" y="257" class="label">e</text>
<text x="264" y="176" class="label">+</text><text x="264" y="199" class="label">−</text><text x="170" y="187" class="label">UBEQ</text><text x="177" y="105" class="label">IBQ</text><text x="520" y="167" class="label">β̄ IBQ</text>
<path d="M30 279H670" stroke="#dce5d5"/>
<text x="30" y="312" class="head">交流小信号 · 研究 Q 点附近的增量</text>
<text x="30" y="338" class="small">正向放大、小信号、低频；所有模型参数由 Q 点决定</text>
