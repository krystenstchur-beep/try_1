<text x="30" y="415" class="note" text-anchor="start">Au0：空载电压增益；受控电压源由输入 ui 控制，不是独立电源。</text>
<text x="30" y="452" class="note" text-anchor="start">ui = us Ri / (Rs + Ri)；uo = Au0 ui RL / (Ro + RL)。</text></svg>