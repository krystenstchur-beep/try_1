<text x="46" y="266" class="" text-anchor="start">us</text>
<text x="275" y="270" class="" text-anchor="end">ui</text>
<text x="370" y="180" class="small" text-anchor="start">输入口</text>
<path class="wire" d="M620 208L650 250L620 292L590 250Z"/>
<text x="620" y="240" class="" text-anchor="middle">+</text>
