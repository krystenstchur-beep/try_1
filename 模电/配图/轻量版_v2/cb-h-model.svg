<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img"><title>共基小信号模型：B 接交流地，输入加 E</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#226e68"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#22313d;font-size:23px} .wire{fill:none;stroke:#344957;stroke-width:2.5;stroke-linejoin:round} .curve{fill:none;stroke:#226e68;stroke-width:3.5} .small{font-size:20px} .title{font-size:28px;font-weight:600} .note{font-size:20px;fill:#536473}</style>
<rect width="1100" height="600" rx="12" fill="#fff"/><rect x="1" y="1" width="1098" height="598" rx="12" fill="none" stroke="#d5dfdf"/>
<text x="30" y="43" class="title" text-anchor="start">共基小信号模型：B 接交流地，输入加 E</text>
<path class="wire" d="M350 340L940 340"/>
<text x="962" y="350" class="" text-anchor="start">ui（E）</text>
<circle cx="620" cy="340" r="4" fill="#344957"/>
<circle cx="800" cy="340" r="4" fill="#344957"/>
<path class="wire" d="M350 130L350 209.0"/>
<path class="wire" d="M350 261.0L350 340"/>
<rect x="341" y="209.0" width="18" height="52" fill="white" stroke="#344957" stroke-width="2.5"/>
<text x="332" y="242.0" class="" text-anchor="end">rbe</text>
<g transform="translate(350 130) rotate(180)">
<path class="wire" d="M0 0L0 12"/>
<path class="wire" d="M-15 12L15 12"/>
<path class="wire" d="M-10 18L10 18"/>
<path class="wire" d="M-5 24L5 24"/>
</g>
<text x="285" y="85" class="small" text-anchor="start">B：交流地</text>
<path class="wire" d="M620 160L620 218.0"/>
<path class="wire" d="M620 282.0L620 340"/>
<path class="wire" d="M620 218.0L644 250.0L620 282.0L596 250.0Z"/>
<path class="wire" d="M620 232.0L620 268.0" marker-end="url(#a)"/>
<text x="655" y="258.0" class="" text-anchor="start">βib</text>
<path class="wire" d="M620 160L940 160"/>
<circle cx="620" cy="160" r="4" fill="#344957"/>
<circle cx="800" cy="160" r="4" fill="#344957"/>
<text x="970" y="170" class="" text-anchor="start">uo（C）</text>
<path class="wire" d="M800 160L800 99.0"/>
<path class="wire" d="M800 151.0L800 90"/>
<rect x="791" y="99.0" width="18" height="52" fill="white" stroke="#344957" stroke-width="2.5"/>
<text x="782" y="132.0" class="" text-anchor="end">RC</text>
<g transform="translate(800 90) rotate(180)">
<path class="wire" d="M0 0L0 12"/>
<path class="wire" d="M-15 12L15 12"/>
<path class="wire" d="M-10 18L10 18"/>
<path class="wire" d="M-5 24L5 24"/>
</g>
<path class="wire" d="M940 160L940 99.0"/>
<path class="wire" d="M940 151.0L940 90"/>
<rect x="931" y="99.0" width="18" height="52" fill="white" stroke="#344957" stroke-width="2.5"/>
<text x="958" y="132.0" class="" text-anchor="start">RL</text>
<g transform="translate(940 90) rotate(180)">
<path class="wire" d="M0 0L0 12"/>
<path class="wire" d="M-15 12L15 12"/>
<path class="wire" d="M-10 18L10 18"/>
<path class="wire" d="M-5 24L5 24"/>
</g>
<path class="wire" d="M800 340L800 379.0"/>
<path class="wire" d="M800 431.0L800 470"/>
<rect x="791" y="379.0" width="18" height="52" fill="white" stroke="#344957" stroke-width="2.5"/>
<text x="818" y="412.0" class="" text-anchor="start">RE</text>
<path class="wire" d="M800 470L800 482"/>
<path class="wire" d="M785 482L815 482"/>
<path class="wire" d="M790 488L810 488"/>
<path class="wire" d="M795 494L805 494"/>
<path class="wire" d="M250 195L250 265" marker-end="url(#a)"/>
<text x="230" y="240" class="" text-anchor="end">ib</text>
<text x="40" y="551" class="note" text-anchor="start">按图中参考方向：ib = −ui / rbe；uo = −β ib (RC ∥ RL)，故电压同相。</text>
<text x="40" y="585" class="note" text-anchor="start">中频、放大区、小信号；忽略管子输出电阻 ro。各地符号表示同一交流参考点。</text></svg>