<title id="t">固定偏置共射电路和直交流通路</title><desc id="d">原电路用 UBB 和 RB 偏置基极，UCC 经 RC 接集电极，发射极接地。C1 与 C2 分别耦合输入与负载。直流时电容开路，信号源和负载被隔离。中频交流时直流源增量为零，RB、RC 与 RL 各自接交流地，RC 与 RL 在输出端并联。</desc>
