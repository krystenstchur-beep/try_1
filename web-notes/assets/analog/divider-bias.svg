<title id="t">分压式部分旁路共射电路</title><desc id="d">RB1 与 RB2 提供基极偏置，RC 是集电极电阻。发射极串联 RE1 与 RE2，CE 只旁路 RE2。输入和负载分别经 C1 和 C2 耦合。直流两射极电阻均保留；中频交流仅 RE1 未被旁路。</desc>
