<svg xmlns="http://www.w3.org/2000/svg" width="520" height="690" viewBox="0 0 520 690" role="img" aria-labelledby="title desc">
<title id="title">叠加定理的原稿电路</title><desc id="desc">上图为电压源 Us、电阻 R1、电阻 R2 和向下的电流源 Is。中图仅电压源作用，电流源开路。下图仅电流源作用，电压源短路。三图电流 i1 的参考方向均从左向右。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#52785a" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#405a45;font-size:22px}.wire{stroke:#52785a;stroke-width:2.5;fill:none}.part{fill:#f1f5ec;stroke:#52785a;stroke-width:2.5}.heading{font-size:23px;font-weight:600}.caption{font-size:21px;fill:#708166}.math{font-family:Georgia,'Times New Roman',serif;font-size:25px}</style>
<rect width="520" height="690" fill="#fbfcf8"/>
<g transform="translate(0 10)">
<text x="24" y="28" class="heading">原电路 · 两个独立源同时作用</text>
<path class="wire" d="M82 98V65H175M225 65H435V101M435 147V181H82V145M320 65V100M320 144V181"/>
<rect class="part" x="175" y="56" width="50" height="18"/><text x="186" y="50" class="math">R₁</text>
<rect class="part" x="311" y="100" width="18" height="44"/><text x="338" y="131" class="math">R₂</text>
<circle class="part" cx="82" cy="122" r="23"/><text x="74" y="117">+</text><text x="75" y="137">−</text><text x="26" y="130" class="math">Uₛ</text>
<circle class="part" cx="435" cy="124" r="23"/><path class="wire" d="M435 108V139" marker-end="url(#arrow)"/><text x="466" y="130" class="math">Iₛ</text>
<path class="wire" d="M112 65H153" marker-end="url(#arrow)"/><text x="119" y="52" class="math">i₁</text>
<text x="24" y="214" class="caption">i₁ = i₁′ + i₁″（按同一方向相加）</text>
</g>
<path d="M24 240H496" stroke="#dce5d5"/>
<g transform="translate(0 240)">
<text x="24" y="28" class="heading">只保留 Uₛ · 电流源置零开路</text>
<path class="wire" d="M82 98V65H175M225 65H435V105M435 143V181H82V145M320 65V100M320 144V181"/>
<rect class="part" x="175" y="56" width="50" height="18"/><text x="186" y="50" class="math">R₁</text>
<rect class="part" x="311" y="100" width="18" height="44"/><text x="338" y="131" class="math">R₂</text>
<circle class="part" cx="82" cy="122" r="23"/><text x="74" y="117">+</text><text x="75" y="137">−</text><text x="26" y="130" class="math">Uₛ</text>
<circle class="part" cx="435" cy="105" r="4"/><circle class="part" cx="435" cy="143" r="4"/>
<path class="wire" d="M112 65H153" marker-end="url(#arrow)"/><text x="117" y="52" class="math">i₁′</text>
<text x="24" y="214" class="caption">i₁′ = Uₛ / (R₁ + R₂)</text>
</g>
<path d="M24 470H496" stroke="#dce5d5"/>
<g transform="translate(0 470)">
<text x="24" y="28" class="heading">只保留 Iₛ · 电压源置零短路</text>
<path class="wire" d="M82 181V65H175M225 65H435V101M435 147V181H82M320 65V100M320 144V181"/>
<rect class="part" x="175" y="56" width="50" height="18"/><text x="186" y="50" class="math">R₁</text>
<rect class="part" x="311" y="100" width="18" height="44"/><text x="338" y="131" class="math">R₂</text>
<circle class="part" cx="435" cy="124" r="23"/><path class="wire" d="M435 108V139" marker-end="url(#arrow)"/><text x="466" y="130" class="math">Iₛ</text>
<path class="wire" d="M112 65H153" marker-end="url(#arrow)"/><text x="117" y="52" class="math">i₁″</text>
<text x="24" y="214" class="caption">i₁″ = Iₛ R₂ / (R₁ + R₂)</text>
</g>
</svg>
