<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-labelledby="title desc">
  <title id="title">互易定理的端口参考方向</title>
  <desc id="desc">端口电压上正下负，电流源向上向网络注入电流，外部短路响应电流向下；端口位置和极性在交换时固定。</desc>
  <style>text{font-family:'Microsoft YaHei',sans-serif;font-size:21px;fill:#38563f}.m{font-family:Georgia,serif;font-size:25px}.wire{fill:none;stroke:#52785a;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.box{fill:#f1f5ec;stroke:#8ca781;stroke-width:2}.small{font-size:18px;fill:#6f8268}</style>
  <rect width="520" height="300" fill="#fbfcf8"/>
  <text x="22" y="32">源向端口注入；短路响应向外流出</text>
  <rect class="box" x="209" y="72" width="100" height="151" rx="5"/>
  <text class="m" x="245" y="153">P</text>
  <path class="wire" d="M70 121V93H209 M70 169V205H209 M309 93H440V205H309"/>
  <circle class="wire" cx="70" cy="145" r="24"/>
  <path class="wire" d="M70 160V130m-6 9 6-9 6 9 M130 93h35m-9-6 9 6-9 6 M440 125v40m-6-9 6 9 6-9"/>
  <text class="m" x="28" y="110">Iₛ</text>
  <text class="m" x="126" y="77">j₁</text>
  <text class="m" x="450" y="151">I<tspan font-size="17" dy="5">sc</tspan></text>
  <text class="m" x="177" y="90">1</text><text class="m" x="174" y="228">1′</text>
  <text class="m" x="325" y="90">2</text><text class="m" x="325" y="228">2′</text>
  <text class="m" x="153" y="127">+</text><text class="m" x="150" y="155">u₁</text><text class="m" x="153" y="191">−</text>
  <text class="m" x="364" y="127">+</text><text class="m" x="355" y="156">u₂</text><text class="m" x="364" y="191">−</text>
  <text class="small" x="25" y="262">流入网络：j₂ = −I<tspan font-size="14" dy="4">sc</tspan></text>
  <text class="small" x="275" y="262">短路：u₂ = 0</text>
</svg>
